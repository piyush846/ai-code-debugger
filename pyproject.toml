[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidbg-cli"
version = "0.3.0"
description = "AI-powered local code debugger with multi-agent architecture and MCP support"
requires-python = ">=3.10"
dependencies = [
    "mcp",
]

[project.scripts]
aidbg = "aidbg.cli:main"
aidbg-mcp = "aidbg.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aidbg*"]