services:
  ollama:
    image: ollama/ollama:latest
    container_name: aidbg-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  aidbg:
    image: piyush846/aidbg:latest
    container_name: aidbg-app
    environment:
      - AIDBG_MODEL=qwen2.5-coder:3b
      - AIDBG_OLLAMA_HOST=http://ollama:11434
      - AIDBG_MAX_ATTEMPTS=4
      - AIDBG_TIMEOUT=600
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - ollama

volumes:
  ollama_models: